<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Chat</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 900px;
            width: 100%;
        }

        /* ===== HEADER ===== */
        h1 {
            color: #2d3748;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        h1::after {
            content: '💬';
            margin-left: 10px;
        }

        /* ===== USER INPUT SECTION ===== */
        .user-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .user-section input {
            flex: 1;
            min-width: 120px;
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #f7fafc;
        }

        .user-section input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .user-section input::placeholder {
            color: #a0aec0;
        }

        /* ===== VIDEO CONTAINER ===== */
        .video-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .video-wrapper {
            background: #1a202c;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            aspect-ratio: 4 / 3;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #2d3748;
            display: block;
        }

        .video-label {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            backdrop-filter: blur(5px);
        }

        /* ===== CHAT MESSAGES ===== */
        .chat-section {
            margin-bottom: 15px;
        }

        #messages {
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            height: 200px;
            overflow-y: auto;
            padding: 15px;
            background: #f7fafc;
            transition: border-color 0.3s ease;
        }

        #messages:focus-within {
            border-color: #667eea;
        }

        #messages::-webkit-scrollbar {
            width: 6px;
        }

        #messages::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 10px;
        }

        #messages::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .message {
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 10px;
            animation: fadeIn 0.3s ease;
        }

        .message .sender {
            font-weight: 600;
            color: #2d3748;
            margin-right: 8px;
        }

        .message .text {
            color: #4a5568;
        }

        .message.system {
            background: #edf2f7;
            color: #718096;
            font-style: italic;
            text-align: center;
            font-size: 13px;
        }

        .message.self {
            background: #667eea;
            color: white;
            margin-left: 20%;
        }

        .message.self .sender {
            color: rgba(255, 255, 255, 0.8);
        }

        .message.self .text {
            color: white;
        }

        .message.other {
            background: white;
            border: 1px solid #e2e8f0;
            margin-right: 20%;
        }

        .message .timestamp {
            font-size: 10px;
            color: #a0aec0;
            margin-left: 8px;
        }

        .message.self .timestamp {
            color: rgba(255, 255, 255, 0.6);
        }

        /* ===== INPUT & BUTTONS ===== */
        .input-section {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #f7fafc;
        }

        #messageInput:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        #messageInput::placeholder {
            color: #a0aec0;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-danger {
            background: #fc8181;
            color: white;
        }

        .btn-danger:hover {
            background: #f56565;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(252, 129, 129, 0.4);
        }

        .btn-success {
            background: #68d391;
            color: white;
        }

        .btn-success:hover {
            background: #48bb78;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(104, 211, 145, 0.4);
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .video-container {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .video-wrapper {
                aspect-ratio: 16 / 9;
            }

            .user-section {
                flex-direction: column;
            }

            .input-section {
                flex-direction: column;
            }

            #messageInput {
                width: 100%;
            }

            .btn {
                width: 100%;
            }

            h1 {
                font-size: 22px;
            }

            .message.self {
                margin-left: 10%;
            }

            .message.other {
                margin-right: 10%;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 10px;
                border-radius: 15px;
            }

            #messages {
                height: 150px;
                padding: 10px;
            }

            .message {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Video Chat</h1>

        <!-- User Inputs -->
        <div class="user-section">
            <input type="text" id="roomIdInput" placeholder="🏠 Room ID...">
            <input type="text" id="userIdInput" placeholder="👤 User ID...">
            <button class="btn btn-primary" onclick="joinRoom()">join  room</button>
        </div>

        <!-- Video Section -->
        <div class="video-container">
            <div class="video-wrapper">
                <video id="localVideo" autoplay playsinline muted></video>
                <span class="video-label">📷 You</span>
            </div>
            <div class="video-wrapper">
                <video id="remoteVideo" autoplay playsinline></video>
                <span class="video-label">👤 Remote</span>
            </div>
        </div>

        <!-- Chat Messages -->
        <div class="chat-section">
            <div id="messages"></div>
        </div>

        <!-- Input & Buttons -->
        <div class="input-section">
            <input type="text" id="messageInput" placeholder="💬 Type a message...">
            <button class="btn btn-primary" onclick="submit()">Send</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
